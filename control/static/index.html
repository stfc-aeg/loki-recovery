      <div class="container">

        <div class="odin-server">
          <h1>LOKI selftest</h1>
          <p class="lead">Welcome to LOKI selftest!</p>
          
          <p>Is LED pattern running:&nbsp;<span id="pattern_running">&nbsp;</span></p>
          <p>&nbsp;<input type="button" id="run_LED_test" value = "run LED test" onclick="run_LED_test()"/></p>
          <p>Input pattern: &nbsp;<input type="text" id="LED_list" value = LED_list size="30"/></p>
          <p>&nbsp;<input type="button" id="run_GPIO_test" value = "Test GPIO pins" onclick="run_GPIO_test()"/></p>
          <input type="radio" id="1&2" name="which_pins" value="pins1&2">
          <label for="1&2">1&2</label> hello&nbsp;<span id="is_1&2_working">&nbsp;</span>
           <p>are pins working?:&nbsp;<span id="working"">&nbsp;</span></p>
